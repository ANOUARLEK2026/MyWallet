name: Build MyWallet APK
on: [workflow_dispatch, push]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: npm install
      - run: npx cap add android
      - name: Icon (App.png), FileSaver plugin, portrait
        run: bash scripts/android-customize.sh
      - run: npx cap sync android
      - name: Stable signing key (so new builds update the installed app and keep its data)
        run: |
          if keytool -list -keystore android-keystore/debug.keystore -storepass android >/dev/null 2>&1; then
            mkdir -p ~/.android && cp android-keystore/debug.keystore ~/.android/debug.keystore
          fi
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: {name: MyWallet-apk, path: android/app/build/outputs/apk/debug/app-debug.apk}
